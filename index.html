<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#11151c" />
    <title>Stickman Arena</title>
    <style>
      html, body { margin: 0; height: 100%; background: #11151c; overflow: hidden; }
      /* Phones: the visible height, so the game fills the screen past the browser's bars. */
      @supports (height: 100dvh) { html, body { height: 100dvh; } }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #status {
        position: fixed; left: 12px; top: 84px; padding: 6px 10px; border-radius: 6px;
        font: 12px/1.4 system-ui, sans-serif; color: #e8edf5; background: rgba(0, 0, 0, 0.45);
        pointer-events: none; max-width: min(44vw, 520px); box-sizing: border-box;
      }
      #status[data-state='error'] { background: rgba(160, 20, 20, 0.85); }
      .touch-controls { position: fixed; inset: 0; pointer-events: none; z-index: 7; } /* above the blind and dark veils */
      /* Holding a button (block) must not select or highlight its label, or open the iOS/Android callout. */
      .touch-controls, .touch-controls * {
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent; outline: none;
      }
      .touch-controls[hidden], .joystick[hidden] { display: none; }
      .joystick {
        position: fixed; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%;
        border: 3px solid rgba(232, 237, 245, 0.45); background: rgba(0, 0, 0, 0.18);
      }
      .joystick-knob {
        position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; border-radius: 50%;
        background: rgba(232, 237, 245, 0.75); transform: translate(-50%, -50%);
      }
      /* Blinded (owner, 12/11/2026): the view closes in to a small window in the middle. */
      .blind-veil {
        position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 5;
        background: radial-gradient(circle at 50% 50%, rgba(10, 4, 18, 0) 0, rgba(10, 4, 18, 0) 12%,
          rgba(26, 13, 38, 0.92) 30%, rgba(10, 4, 18, 0.97) 100%);
        transition: opacity 0.15s linear;
      }
      /* Lights out (owner, 12/11/2026, Hunting Frenzy): the darkened player sees only a small circle. */
      .dark-veil {
        position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 5; display: none;
        background: radial-gradient(circle var(--r, 80px) at var(--x, 50%) var(--y, 50%),
          rgba(2, 2, 6, 0) 0, rgba(2, 2, 6, 0) 55%, rgba(2, 2, 6, 0.9) 85%, rgba(1, 1, 3, 0.985) 100%);
      }
      .dark-veil.on { display: block; }
      /* ...while Shroud sees in the dark like night vision: green, grainy, nothing hidden. */
      .night-vision {
        position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 5; display: none;
        backdrop-filter: grayscale(0.9) brightness(0.8) contrast(1.25);
        background:
          repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.12) 0 1px, rgba(0, 0, 0, 0) 1px 3px),
          radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0) 55%, rgba(0, 10, 2, 0.6) 100%),
          rgba(70, 255, 120, 0.16);
        transition: opacity 0.2s linear;
      }
      .night-vision.on { display: block; }
      /* Fire Beam on touch (owner, 12/11/2026): the joystick aims the beam while it pours. */
      body.aiming .joystick, .joystick.aiming { border-color: rgba(255, 140, 40, 0.95); box-shadow: 0 0 14px rgba(255, 110, 20, 0.6); }
      body.aiming .joystick::after, .joystick.aiming::after {
        content: 'AIM'; position: absolute; left: 50%; top: -20px; transform: translateX(-50%);
        font: 800 11px system-ui, sans-serif; color: #ffb35c; text-shadow: 0 1px 0 #000;
      }
      .joystick.aiming .joystick-knob { background: rgba(255, 150, 60, 0.9); }
      body.aiming .joystick .joystick-knob { background: rgba(255, 150, 60, 0.9); }
      /* Targeting (owner, 12/11/2026): clear instructions while picking a target; ✕ cancels on touch. */
      .aim-hint {
        position: fixed; left: 50%; top: 64px; transform: translateX(-50%); z-index: 6; max-width: min(92vw, 640px);
        padding: 8px 16px; border-radius: 10px; border: 2px solid rgba(255, 170, 90, 0.85); background: rgba(16, 18, 26, 0.88);
        color: #fff1e0; font: 700 14px/1.35 system-ui, sans-serif; text-align: center; pointer-events: none;
      }
      .aim-hint[hidden] { display: none; }
      /* Button text always stays inside its button (owner, 12/11/2026): no padding eating the
         width, centred, one line; tests/e2e/button-fit.spec.ts checks every button. */
      .util-button, .dodge-button, .melee-button, .heavy-button, .ability-button {
        display: grid; place-items: center; padding: 0; white-space: nowrap;
      }
      .util-button {
        position: fixed; right: calc(24px + env(safe-area-inset-right)); bottom: 190px;
        width: 64px; height: 64px; border-radius: 18px; border: 3px solid rgba(232, 237, 245, 0.6);
        background: rgba(30, 36, 48, 0.7); color: #e8edf5; font: 700 12px system-ui, sans-serif;
        pointer-events: auto; touch-action: none;
      }
      /* Dodge (owner, 11/11/2026): a movement button like UTIL (not one of the five combat buttons);
         it fills back up as the weight-based cooldown runs out. */
      .dodge-button {
        position: fixed; right: calc(24px + env(safe-area-inset-right)); bottom: 266px;
        width: 64px; height: 64px; border-radius: 18px; border: 3px solid rgba(140, 200, 255, 0.75);
        color: #e8f4ff; font: 700 12px system-ui, sans-serif; pointer-events: auto; touch-action: none;
        background: conic-gradient(rgba(40, 110, 170, 0.8) var(--fill, 100%), rgba(20, 22, 28, 0.85) 0);
      }
      .heavy-button {
        position: fixed; right: calc(286px + env(safe-area-inset-right)); bottom: 30px; width: 58px; height: 58px;
        border-radius: 50%; border: 3px solid rgba(255, 110, 80, 0.85); background: rgba(110, 30, 20, 0.75);
        color: #fff0e6; font: 800 11px system-ui, sans-serif; pointer-events: auto; touch-action: none;
      }
      .aim-cancel-button {
        position: fixed; left: calc(24px + env(safe-area-inset-left)); top: 110px; display: none;
        width: 56px; height: 56px; border-radius: 50%; border: 3px solid rgba(255, 120, 110, 0.9);
        background: rgba(110, 20, 20, 0.8); color: #fff; font: 800 24px system-ui, sans-serif;
        pointer-events: auto; touch-action: none; place-items: center; padding: 0;
      }
      body.aiming .aim-cancel-button { display: grid; }
      .melee-button {
        position: fixed; right: calc(110px + env(safe-area-inset-right)); bottom: 40px;
        width: 84px; height: 84px; border-radius: 50%; border: 3px solid rgba(255, 170, 110, 0.85);
        background: rgba(120, 50, 20, 0.7); color: #fff2e6; font: 700 13px system-ui, sans-serif;
        pointer-events: auto; touch-action: none;
      }
      .ability-button {
        position: fixed; width: 60px; height: 60px; border-radius: 50%;
        border: 3px solid rgba(255, 140, 60, 0.85); color: #fff2e6; font: 800 12px system-ui, sans-serif;
        background: conic-gradient(rgba(200, 70, 20, 0.85) var(--fill, 100%), rgba(20, 22, 28, 0.85) 0);
        pointer-events: auto; touch-action: none;
      }
      .ability-button[data-slot='a1'] { right: calc(212px + env(safe-area-inset-right)); bottom: 28px; }
      .ability-button[data-slot='a2'] { right: calc(204px + env(safe-area-inset-right)); bottom: 108px; }
      .ability-button[data-slot='a3'] { right: calc(136px + env(safe-area-inset-right)); bottom: 150px; }
      .ability-button[data-slot='a4'] { right: calc(64px + env(safe-area-inset-right)); bottom: 126px; }
      .ability-button.ult {
        right: calc(28px + env(safe-area-inset-right)); bottom: 44px; width: 70px; height: 70px;
        border-color: rgba(255, 210, 63, 0.9);
        background: conic-gradient(rgba(255, 170, 30, 0.9) var(--fill, 0%), rgba(20, 22, 28, 0.85) 0);
      }
      .ability-button.no-stamina, .ability-slot.no-stamina { filter: grayscale(0.9) brightness(0.7); }
      .ability-button.ult.ready, .ability-slot.ult.ready { animation: ult-glow 0.9s ease-in-out infinite alternate; }
      @keyframes ult-glow { from { box-shadow: 0 0 6px 2px rgba(255, 190, 40, 0.5); } to { box-shadow: 0 0 22px 8px rgba(255, 120, 20, 0.9); } }
      .ability-bar {
        position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 8px; z-index: 7;
        pointer-events: none; font: 600 11px system-ui, sans-serif; color: #e8edf5;
      }
      .ability-bar[hidden], body.touch-mode .ability-bar { display: none; }
      .ability-slot {
        position: relative; width: 64px; height: 64px; border-radius: 8px; overflow: hidden;
        border: 2px solid rgba(255, 140, 60, 0.7); display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 2px;
        background: linear-gradient(to top, rgba(200, 70, 20, 0.75) var(--fill, 100%), rgba(20, 22, 28, 0.8) 0);
      }
      .ability-slot.ult {
        border-color: rgba(255, 210, 63, 0.9);
        background: linear-gradient(to top, rgba(255, 170, 30, 0.85) var(--fill, 0%), rgba(20, 22, 28, 0.8) 0);
      }
      .ab-key { position: absolute; left: 4px; top: 2px; font-weight: 800; color: #ffd8b0; }
      /* Ability pictures (owner, 12/11/2026) on the bar and the touch buttons. */
      .ab-icon { display: grid; place-items: center; margin-top: 8px; width: 34px; height: 34px; font-weight: 700; font-size: 11px; }
      .ab-icon svg { width: 100%; height: 100%; filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.6)); }
      .ability-button .ab-icon { margin: 0; width: 72%; height: 72%; pointer-events: none; }
      .ability-button .ab-ult { position: absolute; bottom: 6px; left: 0; right: 0; font: 800 9px system-ui, sans-serif; color: #fff2a8; text-shadow: 0 1px 0 #000; pointer-events: none; }
      .ab-cost { font-size: 10px; opacity: 0.85; }
      .clash-hud {
        position: fixed; left: 50%; top: 46px; transform: translateX(-50%); pointer-events: none;
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        font: 800 14px system-ui, sans-serif; color: #fff; text-shadow: 0 2px 0 #000;
      }
      .clash-hud[hidden], .clash-banner[hidden] { display: none; }
      .clash-title { font-size: 20px; letter-spacing: 0.12em; color: #ffd23f; }
      .clash-row { display: flex; align-items: center; gap: 10px; }
      .clash-power { min-width: 34px; text-align: center; font-size: 22px; }
      .clash-a { color: #ff9a4d; } .clash-b { color: #d6dbe4; }
      .clash-bar {
        position: relative; width: min(46vw, 420px); height: 18px; border-radius: 9px; overflow: hidden;
        background: #c8ced8; border: 2px solid rgba(0, 0, 0, 0.6);
        box-shadow: 0 0 calc(var(--intensity, 0) * 18px) rgba(255, 140, 40, 0.9);
      }
      .clash-fill { height: 100%; width: 50%; background: linear-gradient(90deg, #ff4d1a, #ffb04d); transition: width 0.08s linear; }
      .clash-timer { font-size: 26px; }
      .clash-prompt { font-size: 15px; color: #ffe8a0; animation: clash-pulse 0.25s ease-in-out infinite alternate; }
      .clash-hud.final .clash-timer { color: #ff4d4d; font-size: 32px; }
      .clash-hud.final .clash-title { color: #ff4d4d; }
      @keyframes clash-pulse { from { transform: scale(1); } to { transform: scale(1.12); } }
      .clash-banner {
        position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%); pointer-events: none;
        font: 900 44px system-ui, sans-serif; letter-spacing: 0.06em; text-shadow: 0 3px 0 #000, 0 0 18px rgba(0, 0, 0, 0.8);
        animation: clash-banner 1.6s ease-out forwards;
      }
      .clash-banner[data-kind='win'] { color: #ffd23f; }
      .clash-banner[data-kind='lose'] { color: #ff6b6b; }
      .clash-banner[data-kind='tie'] { color: #9fd6ff; }
      @keyframes clash-banner { 0% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; } 12% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
      .combat-text-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .combat-text {
        position: absolute; transform: translate(-50%, -100%); white-space: nowrap;
        font: 800 18px/1 system-ui, sans-serif; color: #fff; letter-spacing: 0.02em;
        text-shadow: 0 2px 0 #000, 0 0 6px rgba(0, 0, 0, 0.8);
        animation: ct-rise 0.9s ease-out forwards;
      }
      .ct-crit { color: #ffd23f; font-size: 22px; }
      .ct-blocked { color: #9fd6ff; font-size: 15px; }
      .ct-parry { color: #7df9ff; font-size: 20px; }
      .ct-break { color: #ff8a3d; font-size: 18px; }
      .ct-dodge { color: #d6ffb0; font-size: 15px; }
      .ct-ko { color: #ff4d4d; font-size: 34px; }
      .ct-burn { color: #ff9d3d; font-size: 14px; }
      .ct-combo { color: #ffe066; font-size: 17px; letter-spacing: 0.04em; }
      .ct-miss { color: #c9d3e0; font-size: 15px; font-style: italic; }
      @keyframes ct-rise {
        0% { opacity: 0; transform: translate(-50%, -60%) scale(0.7); }
        12% { opacity: 1; transform: translate(-50%, -100%) scale(1.15); }
        25% { transform: translate(-50%, -110%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -260%) scale(1); }
      }
      #debug {
        position: fixed; left: 12px; top: 12px; padding: 6px 10px; border-radius: 6px;
        font: 12px/1.4 ui-monospace, monospace; color: #39ff88; background: rgba(0, 0, 0, 0.6);
        pointer-events: none;
      }
      /* Settings (owner, 11/11/2026): gear button, audio sliders, rebindable controls. */
      .settings-button {
        position: fixed; right: calc(12px + env(safe-area-inset-right)); top: 12px; z-index: 30;
        width: 40px; height: 40px; border-radius: 10px; border: 2px solid rgba(232, 237, 245, 0.55);
        background: rgba(20, 24, 32, 0.75); color: #e8edf5; font: 22px/1 system-ui, sans-serif; cursor: pointer;
      }
      .settings-button.active, .settings-button:hover { background: rgba(60, 70, 92, 0.9); }
      .settings-panel {
        position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
        background: rgba(5, 8, 12, 0.6); font: 14px/1.4 system-ui, sans-serif; color: #e8edf5;
        -webkit-user-select: none; user-select: none;
      }
      .settings-panel[hidden], .settings-panel [hidden] { display: none; }
      .settings-card {
        width: min(92vw, 480px); max-height: 88vh; overflow-y: auto; padding: 16px 18px 18px;
        border-radius: 14px; background: #1b212c; border: 2px solid rgba(232, 237, 245, 0.18);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      }
      .settings-head { display: flex; align-items: center; justify-content: space-between; }
      .settings-head h2 { margin: 0; font-size: 20px; }
      .settings-close { background: none; border: 0; color: #e8edf5; font-size: 20px; cursor: pointer; }
      .settings-tabs { display: flex; gap: 6px; margin: 12px 0 14px; }
      .settings-tabs button, .settings-reset {
        flex: 1; padding: 8px 10px; border-radius: 8px; border: 2px solid rgba(232, 237, 245, 0.25);
        background: #262e3c; color: #e8edf5; font: 700 14px system-ui, sans-serif; cursor: pointer;
      }
      .settings-tabs button.active { background: #ff8a3d; border-color: #ffb27a; color: #1b120a; }
      .settings-slider { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; margin-bottom: 14px; font-weight: 600; }
      .settings-slider input { grid-column: 1; accent-color: #ff8a3d; }
      .settings-slider output { grid-column: 2; grid-row: 1 / span 2; align-self: end; min-width: 3.2em; text-align: right; }
      .settings-hint { margin: 0 0 8px; opacity: 0.75; font-size: 12px; }
      .settings-binds h3 { margin: 10px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.7; }
      .settings-bind { display: flex; align-items: center; justify-content: space-between; padding: 3px 0; }
      .settings-key {
        min-width: 120px; padding: 5px 10px; border-radius: 7px; border: 2px solid rgba(232, 237, 245, 0.3);
        background: #11151c; color: #e8edf5; font: 700 13px system-ui, sans-serif; cursor: pointer;
      }
      .settings-key.changed { border-color: #ffb27a; }
      .settings-key.waiting { border-color: #ffd23f; color: #ffd23f; }
      .settings-message {
        position: sticky; top: -16px; z-index: 1; min-height: 1.4em; margin: 0 0 6px; padding: 4px 0;
        background: #1b212c; font-weight: 600;
      }
      .settings-message[data-kind='error'] { color: #ff6b6b; }
      .settings-reset { width: 100%; margin-top: 12px; }
      /* Top HUD (PRS-10): both fighters at a glance, the match clock and the last action. */
      .top-hud {
        position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 20;
        width: min(calc(100vw - 132px), 860px); display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px;
        pointer-events: none; font: 700 12px system-ui, sans-serif; color: #f2f5fa; text-shadow: 0 1px 0 #000;
      }
      .th-side { --accent: #ffb27a; --slant: -18deg; display: flex; gap: 10px; align-items: flex-start; }
      .th-right { --slant: 18deg; flex-direction: row-reverse; text-align: right; }
      .th-info { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
      .th-name {
        padding: 0 10px; font: italic 900 14px system-ui, sans-serif; letter-spacing: 0.06em; text-transform: uppercase;
        color: #fff; text-shadow: 0 2px 0 #000, 0 0 6px var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      /* Slanted, framed bars: a dark steel frame with a bright rim in the fighter's colour. */
      .th-bar {
        position: relative; height: 16px; transform: skewX(var(--slant)); margin: 0 6px; overflow: hidden;
        background: linear-gradient(#1a1d26, #0b0d12); border: 2px solid #050608; border-radius: 2px;
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 70%, #fff), 0 2px 6px rgba(0, 0, 0, 0.6),
          0 0 10px color-mix(in srgb, var(--accent) 35%, transparent);
      }
      .th-st { height: 7px; margin-right: 34%; }
      .th-right .th-st { margin-right: 6px; margin-left: 34%; }
      .th-bar > div { position: absolute; top: 0; bottom: 0; left: 0; transition: width 0.08s linear; }
      .th-right .th-bar > div { left: auto; right: 0; }
      /* Glossy fill: a pale lit band on top, deep shade below; a tick scale every tenth. */
      .th-hp .th-fill { background: linear-gradient(#d9ffd9 0, #7ff08f 22%, #34c653 52%, #1d8f36 80%, #146b28 100%); }
      .th-hp .th-lag { background: linear-gradient(#ffb199, #ff5636 40%, #b81f12); transition: none; }
      .th-hp::after {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(0, 0, 0, 0.35) calc(10% - 1px) 10%),
          linear-gradient(rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0) 45%);
      }
      .th-st .th-fill { background: linear-gradient(#fff2b8, #ffcf3f 45%, #d99a12); }
      .th-status { display: flex; gap: 4px; min-height: 16px; padding: 0 8px; }
      .th-right .th-status { justify-content: flex-end; }
      .th-chip {
        padding: 1px 7px; font: italic 800 10px system-ui, sans-serif; letter-spacing: 0.05em;
        background: rgba(0, 0, 0, 0.7); transform: skewX(var(--slant));
      }
      .th-chip-burning { color: #ffb347; border: 1px solid #ff7a1a; }
      .th-chip-stunned { color: #ffe066; border: 1px solid #ffd23f; }
      .th-chip-guarding { color: #9fe0ff; border: 1px solid #7fd8ff; }
      .th-chip-down, .th-chip-ko { color: #ff8f8f; border: 1px solid #e04a3a; }
      /* Slanted portrait frame with the fighter's colour on its rim. */
      .th-portrait {
        width: 48px; height: 48px; display: grid; place-items: center; overflow: hidden;
        clip-path: polygon(14% 0, 100% 0, 86% 100%, 0 100%); border: 0; border-radius: 0;
        background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 55%, #10131a), #0b0d12 70%);
        box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 80%, #fff);
      }
      .th-right .th-portrait { clip-path: polygon(0 0, 86% 0, 100% 100%, 14% 100%); }
      .th-portrait span { width: 26px; height: 26px; border-radius: 50%; background: var(--fighter, #ccc); border: 3px solid #1b1b1f; }
      .th-portrait[data-style='flame'] span {
        border: 0; width: 28px; height: 28px; margin-top: 6px;
        background: radial-gradient(circle at 42% 40%, #fffbe6 0 18%, #ffc94a 32%, #ff8c1e 58%, #d8320c 76%, transparent 78%);
        box-shadow: 0 -8px 10px -2px rgba(255, 140, 30, 0.9), 0 -14px 12px -6px rgba(255, 220, 90, 0.8);
      }
      .th-centre { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 120px; }
      /* A big italic timer on a slanted dark plate. */
      .th-timer {
        padding: 1px 16px; font: italic 900 26px system-ui, sans-serif; font-variant-numeric: tabular-nums;
        color: #ffe39a; text-shadow: 0 2px 0 #000, 2px 0 0 #000, -2px 0 0 #000, 0 -1px 0 #000, 0 0 12px rgba(255, 170, 60, 0.6);
        background: linear-gradient(#232836, #0b0d12); clip-path: polygon(10% 0, 90% 0, 100% 100%, 0 100%);
      }
      .th-action { font: italic 800 12px system-ui, sans-serif; color: #ffd8b0; min-height: 16px; white-space: nowrap; }
      .th-action.pop { animation: th-pop 0.35s ease-out; }
      @keyframes th-pop { from { transform: scale(1.35); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }
      /* Touch screens: the controls hint is for keyboards; only an error message is shown there. */
      @media (pointer: coarse) {
        #status:not([data-state='error']) { display: none; }
      }
      @media (max-width: 640px) {
        .top-hud { gap: 6px; }
        .th-portrait { width: 32px; height: 32px; }
        .th-centre { min-width: 70px; }
        .th-timer { font-size: 15px; }
        .th-name { font-size: 11px; }
      }
      /* READY... FIGHT! (owner, 12/11/2026): cinematic fight-game lettering before every fight. */
      .fight-intro { position: fixed; inset: 0; z-index: 40; pointer-events: none; overflow: hidden; }
      .fight-intro[hidden] { display: none; }
      .fi-vignette {
        position: absolute; inset: 0; opacity: 0; transition: opacity 0.35s ease;
        background: radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, 0.72) 100%),
          linear-gradient(transparent 38%, rgba(0, 0, 0, 0.45) 46%, rgba(0, 0, 0, 0.45) 58%, transparent 66%);
      }
      .fi-lead-in .fi-vignette, .fi-ready .fi-vignette, .fi-fight .fi-vignette { opacity: 1; }
      .fi-word {
        position: absolute; left: 50%; top: 50%; opacity: 0; white-space: nowrap;
        font: italic 900 clamp(64px, 13vw, 190px) / 1 Impact, 'Arial Black', system-ui, sans-serif; letter-spacing: 0.02em;
        transform: translate(-50%, -50%) skewX(-10deg);
      }
      /* A dark extruded slab behind the face gives the letters depth. */
      .fi-word::before {
        content: attr(data-text); position: absolute; inset: 0; z-index: -1; color: #120700;
        -webkit-text-stroke: 0.09em #090400; transform: translate(0.05em, 0.07em);
      }
      .fi-face {
        display: block; color: transparent; -webkit-background-clip: text; background-clip: text;
        -webkit-text-stroke: 0.025em rgba(10, 6, 2, 0.9); background-size: 260% 100%, 100% 100%;
        animation: fi-sweep 1.4s ease-in-out infinite;
      }
      @keyframes fi-sweep { from { background-position: 130% 0, 0 0; } to { background-position: -130% 0, 0 0; } }
      /* READY: cold polished steel, sliding in heavy and steady. */
      .fi-face-ready {
        background-image: linear-gradient(100deg, transparent 40%, rgba(255, 255, 255, 0.95) 50%, transparent 60%),
          linear-gradient(#ffffff 0%, #dfe9ff 28%, #8ea3cf 49%, #3b4c75 51%, #b9c9ee 72%, #eef3ff 88%, #5a6b92 100%);
        filter: drop-shadow(0 0 14px rgba(130, 170, 255, 0.55));
      }
      .fi-ready .fi-ready { animation: fi-ready-in 0.55s cubic-bezier(0.2, 1.4, 0.4, 1) forwards, fi-breathe 1.2s 0.55s ease-in-out infinite alternate; }
      .fi-fight .fi-ready { animation: fi-ready-out 0.18s ease-in forwards; opacity: 1; }
      @keyframes fi-ready-in {
        0% { opacity: 0; transform: translate(-130%, -50%) skewX(-28deg); filter: blur(10px); }
        60% { opacity: 1; filter: blur(0); }
        100% { opacity: 1; transform: translate(-50%, -50%) skewX(-10deg); filter: blur(0); }
      }
      @keyframes fi-breathe { from { transform: translate(-50%, -50%) skewX(-10deg) scale(1); } to { transform: translate(-50%, -50%) skewX(-10deg) scale(1.04); } }
      @keyframes fi-ready-out { to { opacity: 0; transform: translate(-50%, -50%) skewX(-10deg) scale(0.6); filter: blur(6px); } }
      /* FIGHT!: molten red-gold, slammed down from the screen with a flash, a shockwave and a shake. */
      .fi-face-fight {
        background-image: linear-gradient(100deg, transparent 40%, rgba(255, 255, 230, 0.95) 50%, transparent 60%),
          linear-gradient(#fffbe0 0%, #ffe066 24%, #ff9a1f 47%, #c4220a 52%, #ff6a1a 70%, #ffd25a 88%, #7a1004 100%);
        filter: drop-shadow(0 0 22px rgba(255, 110, 20, 0.85)) drop-shadow(0 0 4px rgba(255, 240, 180, 0.9));
      }
      .fi-fight .fi-fight { animation: fi-slam 0.42s cubic-bezier(0.3, 0, 0.3, 1) forwards; }
      @keyframes fi-slam {
        0% { opacity: 0; transform: translate(-50%, -50%) skewX(-10deg) scale(4.5) rotate(-8deg); filter: blur(14px); }
        55% { opacity: 1; transform: translate(-50%, -50%) skewX(-10deg) scale(0.88) rotate(0deg); filter: blur(0); }
        72% { transform: translate(-50%, -50%) skewX(-10deg) scale(1.1); }
        100% { opacity: 1; transform: translate(-50%, -50%) skewX(-10deg) scale(1); filter: blur(0); }
      }
      .fi-out .fi-fight { opacity: 1; animation: fi-burst 0.55s ease-in forwards; }
      @keyframes fi-burst { to { opacity: 0; transform: translate(-50%, -50%) skewX(-10deg) scale(1.9); filter: blur(10px); } }
      .fi-out .fi-vignette { opacity: 0; }
      .fi-flash { position: absolute; inset: 0; background: #fff6e0; opacity: 0; }
      .fi-fight .fi-flash { animation: fi-flash 0.4s 0.2s ease-out; }
      @keyframes fi-flash { 0% { opacity: 0; } 15% { opacity: 0.85; } 100% { opacity: 0; } }
      .fi-ring {
        position: absolute; left: 50%; top: 50%; width: 30vmin; height: 30vmin; margin: -15vmin 0 0 -15vmin; border-radius: 50%;
        border: 6px solid rgba(255, 200, 90, 0.9); box-shadow: 0 0 30px rgba(255, 120, 20, 0.8), inset 0 0 30px rgba(255, 120, 20, 0.6); opacity: 0;
      }
      .fi-fight .fi-ring { animation: fi-ring 0.6s 0.22s ease-out; }
      @keyframes fi-ring { 0% { opacity: 1; transform: scale(0.2); } 100% { opacity: 0; transform: scale(4); } }
      .fi-lines {
        position: absolute; inset: -20%; opacity: 0;
        background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255, 230, 170, 0.32) 0deg 1.2deg, transparent 1.2deg 9deg);
        -webkit-mask-image: radial-gradient(circle, transparent 18%, #000 60%); mask-image: radial-gradient(circle, transparent 18%, #000 60%);
      }
      .fi-fight .fi-lines { animation: fi-lines 0.9s 0.2s ease-out; }
      @keyframes fi-lines { 0% { opacity: 0.9; transform: rotate(0deg) scale(1.2); } 100% { opacity: 0; transform: rotate(8deg) scale(1); } }
      .fight-intro.fi-fight { animation: fi-shake 0.38s 0.22s linear; }
      @keyframes fi-shake {
        0%, 100% { transform: translate(0, 0); } 15% { transform: translate(-9px, 6px); } 30% { transform: translate(8px, -7px); }
        45% { transform: translate(-6px, -4px); } 60% { transform: translate(5px, 5px); } 80% { transform: translate(-2px, 2px); }
      }
      /* Ultimate showcase (PRS-8): a short white flash with speed lines from the centre. */
      .ult-showcase { position: fixed; inset: 0; pointer-events: none; z-index: 25; opacity: 0; }
      .ult-showcase.on {
        animation: ult-flash 0.42s ease-out;
        background:
          radial-gradient(circle at 50% 50%, rgba(255, 250, 230, 0.75) 0 18%, rgba(255, 200, 120, 0.25) 40%, transparent 65%),
          repeating-conic-gradient(from 0deg at 50% 50%, rgba(255, 255, 255, 0.55) 0deg 1.2deg, transparent 1.2deg 9deg);
        -webkit-mask: radial-gradient(circle at 50% 50%, transparent 0 22%, #000 60%);
        mask: radial-gradient(circle at 50% 50%, transparent 0 22%, #000 60%);
      }
      @keyframes ult-flash { 0% { opacity: 1; } 100% { opacity: 0; } }
      /* Main menu (owner, 12/11/2026): fighter and arena, then Play. */
      .main-menu {
        position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 10px; padding: 16px; box-sizing: border-box; overflow-y: auto;
        background: radial-gradient(circle at 50% 30%, #2a2018 0%, #11151c 70%); color: #f2f5fa;
        font: 14px/1.4 system-ui, sans-serif; -webkit-user-select: none; user-select: none;
      }
      .main-menu[hidden] { display: none; }
      .main-menu h1 { margin: 0 0 4px; font-size: clamp(22px, 5vw, 40px); letter-spacing: 0.14em; color: #ffb27a; text-shadow: 0 3px 0 #000; }
      .main-menu h2 { margin: 6px 0 0; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.75; }
      .mm-fighters { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
      .mm-card {
        width: min(42vw, 230px); display: flex; flex-direction: column; align-items: center; gap: 4px;
        padding: 10px; border-radius: 12px; border: 2px solid rgba(232, 237, 245, 0.25); background: rgba(20, 24, 32, 0.85);
        color: inherit; font: inherit; cursor: pointer; text-align: center;
      }
      .mm-card strong { font-size: 16px; }
      .mm-card small { opacity: 0.7; font-size: 11px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
      .mm-card.selected, .mm-arena.selected { border-color: #ff8a3d; box-shadow: 0 0 0 2px rgba(255, 138, 61, 0.4); }
      .mm-portrait { width: 56px; height: 56px; }
      .mm-arenas { display: flex; gap: 8px; }
      .mm-details { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; background: rgba(8, 10, 14, 0.78); }
      .mm-details[hidden] { display: none; }
      .mm-d-card {
        width: min(560px, 100%); max-height: 100%; overflow-y: auto; box-sizing: border-box; padding: 16px 18px;
        border-radius: 14px; border: 2px solid rgba(255, 138, 61, 0.55); background: #161b24; display: flex; flex-direction: column; gap: 10px;
      }
      .mm-d-head { display: flex; align-items: center; gap: 12px; }
      .mm-d-head .mm-portrait { flex: none; width: 64px; height: 64px; }
      .mm-d-head h2 { margin: 0; font-size: 22px; letter-spacing: 0.06em; text-transform: none; opacity: 1; color: #ffb27a; }
      .mm-d-head p { margin: 2px 0 0; font-size: 12px; opacity: 0.8; }
      .mm-d-stats { display: grid; gap: 6px; }
      .mm-d-stat { display: grid; grid-template-columns: 84px 1fr 30px; align-items: center; gap: 8px; font-size: 12px; }
      .mm-d-stat b { text-align: right; font-variant-numeric: tabular-nums; }
      .mm-d-track { height: 10px; border-radius: 5px; background: rgba(232, 237, 245, 0.12); overflow: hidden; }
      .mm-d-fill { display: block; width: 0; height: 100%; border-radius: 5px; background: linear-gradient(90deg, color-mix(in srgb, var(--fighter, #ff8a3d) 70%, #000), var(--fighter, #ff8a3d) 60%, color-mix(in srgb, var(--fighter, #ff8a3d) 55%, #fff)); transition: width 900ms cubic-bezier(0.22, 1, 0.36, 1); }
      .mm-d-card h3 { margin: 4px 0 0; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.75; }
      .mm-d-abilities { display: grid; gap: 6px; }
      .mm-d-ab-btn {
        width: 100%; display: flex; align-items: center; gap: 10px; padding: 6px 10px; box-sizing: border-box; border-radius: 10px;
        border: 1px solid rgba(232, 237, 245, 0.2); background: rgba(32, 38, 50, 0.9); color: inherit; font: inherit; cursor: pointer; text-align: left;
      }
      .mm-d-ab-btn[aria-expanded='true'] { border-color: var(--fighter, #ff8a3d); }
      .mm-d-ab-icon { flex: none; width: 30px; height: 30px; display: grid; place-items: center; font-size: 18px; }
      .mm-d-ab-icon svg { width: 100%; height: 100%; }
      .mm-d-ab-name { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
      .mm-d-ab-btn kbd { flex: none; padding: 2px 6px; border-radius: 5px; background: rgba(232, 237, 245, 0.12); font: 600 11px system-ui, sans-serif; }
      .mm-d-ab-info { padding: 6px 12px 8px; font-size: 12px; }
      .mm-d-ab-info[hidden] { display: none; }
      .mm-d-ab-info p { margin: 0 0 6px; }
      .mm-d-ab-info dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 0 0 6px; }
      .mm-d-ab-info dt { opacity: 0.7; }
      .mm-d-ab-info dd { margin: 0; }
      .mm-d-how { padding: 6px 8px; border-radius: 8px; background: rgba(255, 138, 61, 0.1); }
      .mm-d-actions { position: sticky; bottom: -16px; display: flex; gap: 10px; justify-content: flex-end; margin: 0 -18px -16px; padding: 10px 18px 14px; background: #161b24; border-top: 1px solid rgba(232, 237, 245, 0.12); }
      .mm-d-actions button { padding: 9px 26px; border-radius: 10px; font: 700 14px system-ui, sans-serif; cursor: pointer; }
      .mm-d-back { border: 1px solid rgba(232, 237, 245, 0.35); background: transparent; color: #f2f5fa; }
      .mm-d-select { border: none; background: #ff8a3d; color: #1a1108; }
      .mm-arena {
        padding: 8px 16px; border-radius: 10px; border: 2px solid rgba(232, 237, 245, 0.25); background: rgba(20, 24, 32, 0.85);
        color: inherit; font: 700 14px system-ui, sans-serif; cursor: pointer;
      }
      .mm-play {
        margin-top: 8px; padding: 12px 48px; border-radius: 12px; border: 0; background: #ff8a3d; color: #1b120a;
        font: 800 18px system-ui, sans-serif; letter-spacing: 0.12em; cursor: pointer;
      }
      /* Rhino portrait (Rampage). */
      .th-portrait[data-style='rhino'] span {
        width: 30px; height: 26px; border-radius: 45% 55% 50% 50%; background: var(--fighter, #8a8f98); border: 3px solid #1d2026; position: relative;
      }
      .th-portrait[data-style='rhino'] span::after {
        content: ''; position: absolute; right: -6px; top: -12px; border-left: 6px solid transparent; border-right: 6px solid transparent;
        border-bottom: 16px solid #e8dcc0; transform: rotate(18deg);
      }
      .th-portrait[data-style='image'] { background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--accent) 35%, #3a3f4c), #14171e); }
      .th-portrait[data-style='image'] img { width: 100%; height: 100%; object-fit: contain; display: block; }
      /* The opponent on the right faces left, towards the player, like a versus screen (owner). */
      .th-right .th-portrait[data-style='image'] img { transform: scaleX(-1); }
      .settings-actions { display: flex; gap: 8px; margin-top: 14px; }
      .settings-actions button {
        flex: 1; padding: 9px 10px; border-radius: 8px; border: 2px solid rgba(232, 237, 245, 0.25); background: #262e3c;
        color: #e8edf5; font: 700 14px system-ui, sans-serif; cursor: pointer;
      }
      .settings-actions .settings-leave { background: #5a1f1f; border-color: #c25a4a; }
      .settings-actions button[hidden] { display: none; }
      /* Phones held sideways (owner, 12/11/2026: fit the whole screen): a compact HUD and a tighter
         touch cluster so nothing overlaps on a short landscape screen. */
      @media (max-height: 480px) {
        .top-hud { top: 4px; width: min(calc(100vw - 120px), 640px); gap: 6px; font-size: 10px; }

        .th-portrait span { transform: scale(0.75); }
        .th-name { font-size: 10px; }
        .th-bar { height: 7px; border-width: 1px; }
        .th-st { height: 4px; }
        .th-status { min-height: 0; }
        .th-centre { min-width: 56px; }
        .th-timer { font-size: 13px; padding: 1px 6px; }
        .th-action { font-size: 10px; }
        .settings-button { top: 4px; width: 34px; height: 34px; font-size: 18px; }
        .melee-button { right: calc(92px + env(safe-area-inset-right)); bottom: 16px; width: 66px; height: 66px; }
        .ability-button { width: 48px; height: 48px; font-size: 11px; }
        .ability-button[data-slot='a1'] { right: calc(170px + env(safe-area-inset-right)); bottom: 12px; }
        .ability-button[data-slot='a2'] { right: calc(164px + env(safe-area-inset-right)); bottom: 74px; }
        .ability-button[data-slot='a3'] { right: calc(110px + env(safe-area-inset-right)); bottom: 100px; }
        .ability-button[data-slot='a4'] { right: calc(112px + env(safe-area-inset-right)); bottom: 152px; }
        .heavy-button { right: calc(226px + env(safe-area-inset-right)); bottom: 12px; width: 48px; height: 48px; font-size: 10px; }
        .ability-button.ult { right: calc(18px + env(safe-area-inset-right)); bottom: 20px; width: 58px; height: 58px; }
        .util-button { right: calc(18px + env(safe-area-inset-right)); bottom: 96px; width: 52px; height: 52px; }
        .dodge-button { right: calc(18px + env(safe-area-inset-right)); bottom: 156px; width: 52px; height: 52px; }
        .util-button, .dodge-button { font-size: 10px; letter-spacing: -0.2px; }
